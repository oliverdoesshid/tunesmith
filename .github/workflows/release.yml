name: Release Windows installer

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish NSIS release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run build

      - name: Build and publish with electron-builder
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # A retried tag workflow must upload to an existing release even after
          # electron-builder's two-hour publication window has passed.
          EP_GH_IGNORE_TIME: "true"

      # electron-builder can target an existing draft. Publish it explicitly so
      # electron-updater can see latest.yml on the public release.
      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release edit "$GITHUB_REF_NAME" --draft=false
